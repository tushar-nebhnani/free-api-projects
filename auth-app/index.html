<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth App | FreeAPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center"
  >
    <!-- ================= TOAST NOTIFICATION ================= -->
    <div
      id="toast"
      class="hidden fixed top-5 left-1/2 transform -translate-x-1/2 z-50 text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center justify-between transition-opacity duration-300 opacity-0 w-full max-w-sm"
    >
      <span id="toast-message"></span>
    </div>

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md mx-4">
      <!-- ================= LOGIN SCREEN ================= -->
      <div id="login-screen" class="block">
        <h2 class="text-2xl font-bold text-center mb-6">Welcome Back</h2>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input
              type="text"
              id="login-username"
              required
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input
              type="password"
              id="login-password"
              required
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <button
            type="submit"
            id="login-btn"
            class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200 flex justify-center items-center"
          >
            <!-- SVG Spinner included in HTML, hidden by default -->
            <svg
              id="login-spinner"
              class="hidden animate-spin h-5 w-5 mr-2 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span id="login-btn-text">Login</span>
          </button>
        </form>
        <p class="text-center text-sm mt-4">
          Don't have an account?
          <button
            onclick="toggleScreen('register-screen')"
            class="text-blue-600 hover:underline"
          >
            Register
          </button>
        </p>
      </div>

      <!-- ================= REGISTER SCREEN ================= -->
      <div id="register-screen" class="hidden">
        <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>
        <form id="register-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input
              type="email"
              id="reg-email"
              required
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input
              type="text"
              id="reg-username"
              required
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input
              type="password"
              id="reg-password"
              required
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>
          <button
            type="submit"
            id="register-btn"
            class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition duration-200 flex justify-center items-center"
          >
            <svg
              id="register-spinner"
              class="hidden animate-spin h-5 w-5 mr-2 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span id="register-btn-text">Register</span>
          </button>
        </form>
        <p class="text-center text-sm mt-4">
          Already have an account?
          <button
            onclick="toggleScreen('login-screen')"
            class="text-blue-600 hover:underline"
          >
            Login
          </button>
        </p>
      </div>

      <!-- ================= DASHBOARD / PROFILE SCREEN ================= -->
      <div id="dashboard-screen" class="hidden">
        <h2 class="text-2xl font-bold text-center mb-6">Your Profile</h2>

        <div
          id="profile-card"
          class="bg-gray-100 p-4 rounded-lg mb-6 border border-gray-200"
        >
          <!-- Profile Loading State -->
          <p
            id="profile-loading"
            class="text-sm text-gray-500 animate-pulse text-center"
          >
            Loading profile data...
          </p>

          <!-- Profile Data (Populated via JS) -->
          <div id="profile-data" class="hidden space-y-2">
            <p>
              <span class="font-semibold">ID:</span>
              <span id="profile-id"></span>
            </p>
            <p>
              <span class="font-semibold">Username:</span>
              <span id="profile-username"></span>
            </p>
            <p>
              <span class="font-semibold">Email:</span>
              <span id="profile-email"></span>
            </p>
            <p>
              <span class="font-semibold">Role:</span>
              <span
                id="profile-role"
                class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded"
              ></span>
            </p>
          </div>
        </div>

        <button
          id="logout-btn"
          class="w-full bg-red-500 text-white font-semibold py-2 rounded-lg hover:bg-red-600 transition duration-200 flex justify-center items-center"
        >
          <svg
            id="logout-spinner"
            class="hidden animate-spin h-5 w-5 mr-2 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span id="logout-btn-text">Logout</span>
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
