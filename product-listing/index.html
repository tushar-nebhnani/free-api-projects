<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store | FreeAPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <header
        class="mb-10 flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-200 pb-6"
      >
        <div>
          <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-1">
            Latest Products
          </h1>
          <p class="text-gray-500">Discover our randomly generated catalog.</p>
        </div>
        <!-- Optional: You could add a cart icon or search bar placeholder here -->
      </header>

      <!-- ================= UI STATES ================= -->

      <!-- 1. Loading State (Skeleton Grid) -->
      <div
        id="loader"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      >
        <!-- Repeating skeleton cards -->
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px]"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden sm:block"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden md:block"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden lg:block"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden lg:block"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden lg:block"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden lg:block"
        ></div>
        <div
          class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 animate-pulse h-[380px] hidden lg:block"
        ></div>
      </div>

      <!-- 2. Error State -->
      <div id="error-container" class="hidden text-center py-16">
        <div
          class="inline-block bg-red-50 text-red-600 p-8 rounded-2xl border border-red-100 max-w-md"
        >
          <svg
            class="w-12 h-12 mx-auto mb-4 text-red-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          <h3 class="text-xl font-bold">Failed to load products</h3>
          <p class="text-sm mt-2 text-red-500">
            We couldn't fetch the catalog. Please try again later.
          </p>
          <button
            onclick="window.location.reload()"
            class="mt-6 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors"
          >
            Refresh Page
          </button>
        </div>
      </div>

      <!-- 3. Success Data State (Grid) -->
      <div
        id="product-grid"
        class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      >
        <!-- Product cards will be injected here by JS -->
      </div>
    </div>

    <!-- ================= DOM MANIPULATION SCRIPT ================= -->
    <script>
      /**
       * The UI object handles all DOM manipulation.
       * Your API script will call these methods to update the screen.
       */
      const UI = {
        elements: {
          loader: document.getElementById("loader"),
          grid: document.getElementById("product-grid"),
          error: document.getElementById("error-container"),
        },

        showLoading() {
          this.elements.loader.classList.remove("hidden");
          this.elements.grid.classList.add("hidden");
          this.elements.error.classList.add("hidden");
        },

        showError() {
          this.elements.loader.classList.add("hidden");
          this.elements.grid.classList.add("hidden");
          this.elements.error.classList.remove("hidden");
        },

        showProducts(productsArray) {
          this.elements.loader.classList.add("hidden");
          this.elements.error.classList.add("hidden");

          // Clear existing content
          this.elements.grid.innerHTML = "";

          // Generate and inject HTML for each product
          productsArray.forEach((product) => {
            const card = document.createElement("div");
            card.className =
              "bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col group cursor-pointer";

            // Fallbacks for missing data
            const title = product.title || "Unknown Product";
            const brand = product.brand || "Generic Brand";
            const price = product.price
              ? `$${product.price}`
              : "Price Unavailable";
            const category = product.category || "Uncategorized";

            // Use thumbnail, or first image, or fallback placeholder
            const imageUrl =
              product.thumbnail ||
              (product.images && product.images[0]) ||
              "https://via.placeholder.com/400x400?text=No+Image";

            card.innerHTML = `
                        <!-- Image Container with aspect ratio -->
                        <div class="relative aspect-square overflow-hidden bg-gray-100 p-4 flex items-center justify-center">
                            <img src="${imageUrl}" alt="${title}" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-500" loading="lazy">
                            <span class="absolute top-3 right-3 bg-white/90 backdrop-blur text-gray-800 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded shadow-sm">
                                ${category}
                            </span>
                        </div>
                        
                        <!-- Product Details -->
                        <div class="p-5 flex flex-col flex-grow">
                            <p class="text-xs text-blue-600 font-semibold uppercase tracking-wider mb-1">${brand}</p>
                            <h2 class="text-lg font-bold text-gray-900 leading-snug mb-2 line-clamp-2">${title}</h2>
                            
                            <div class="mt-auto pt-4 flex items-center justify-between">
                                <span class="text-xl font-extrabold text-gray-900">${price}</span>
                                <button class="bg-gray-900 hover:bg-gray-800 text-white p-2 rounded-lg transition-colors" title="Add to Cart">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
            this.elements.grid.appendChild(card);
          });

          this.elements.grid.classList.remove("hidden");
        },
      };
    </script>

    <script src="script.js"></script>
  </body>
</html>
