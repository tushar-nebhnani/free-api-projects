<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Cat Viewer | FreeAPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-indigo-50 text-indigo-900 font-sans min-h-screen flex items-center justify-center p-4"
  >
    <!-- Main App Card -->
    <div
      class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-indigo-100"
    >
      <!-- Header -->
      <div class="bg-indigo-600 p-6 text-center">
        <h1
          class="text-2xl font-extrabold text-white tracking-wide flex items-center justify-center gap-2"
        >
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 3c-1.1 0-2 .9-2 2v2c-2.8 0-5 2.2-5 5v5l-2 2v1h18v-1l-2-2v-5c0-2.8-2.2-5-5-5V5c0-1.1-.9-2-2-2zm0 2c.6 0 1 .4 1 1v1.3c-.3-.1-.6-.2-1-.2s-.7.1-1 .2V6c0-.6.4-1 1-1z"
            />
          </svg>
          Purr-fect Pics
        </h1>
        <p class="text-indigo-200 text-sm mt-1">Endless feline entertainment</p>
      </div>

      <div class="p-6 sm:p-8 flex flex-col items-center">
        <!-- ================= UI STATES ================= -->

        <!-- 1. Loading State (Skeleton Image Box) -->
        <div
          id="loader"
          class="w-full aspect-square bg-indigo-50 rounded-2xl animate-pulse flex items-center justify-center border-2 border-dashed border-indigo-200 mb-6"
        >
          <svg
            class="w-12 h-12 text-indigo-300 animate-spin"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </div>

        <!-- 2. Error State -->
        <div
          id="error-container"
          class="hidden w-full aspect-square bg-red-50 rounded-2xl flex flex-col items-center justify-center border-2 border-red-100 text-red-500 text-center p-6 mb-6"
        >
          <svg
            class="w-16 h-16 mb-4 text-red-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          <h3 class="text-lg font-bold">Oh no!</h3>
          <p class="text-sm mt-1">The cat ran away. Couldn't load the image.</p>
        </div>

        <!-- 3. Success Data State (Image Container) -->
        <div
          id="image-container"
          class="hidden w-full aspect-square rounded-2xl overflow-hidden shadow-inner bg-black mb-6 relative group"
        >
          <img
            id="cat-image"
            src=""
            alt="A random cat"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
          />
        </div>

        <!-- ================= CONTROLS ================= -->

        <button
          id="next-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg"
        >
          <span id="btn-text">Show Me Another Cat</span>
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M14 5l7 7m0 0l-7 7m7-7H3"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- ================= DOM MANIPULATION SCRIPT ================= -->
    <script>
      /**
       * The UI object handles all DOM manipulation.
       * Your API script will call these methods to update the screen.
       */
      const UI = {
        elements: {
          loader: document.getElementById("loader"),
          imageContainer: document.getElementById("image-container"),
          catImage: document.getElementById("cat-image"),
          error: document.getElementById("error-container"),
          nextBtn: document.getElementById("next-btn"),
          btnText: document.getElementById("btn-text"),
        },

        showLoading() {
          this.elements.loader.classList.remove("hidden");
          this.elements.imageContainer.classList.add("hidden");
          this.elements.error.classList.add("hidden");

          // Disable button
          this.elements.nextBtn.disabled = true;
          this.elements.nextBtn.classList.add(
            "opacity-70",
            "cursor-not-allowed",
          );
          this.elements.btnText.textContent = "Summoning cat...";
        },

        showError() {
          this.elements.loader.classList.add("hidden");
          this.elements.imageContainer.classList.add("hidden");
          this.elements.error.classList.remove("hidden");

          // Re-enable button
          this.elements.nextBtn.disabled = false;
          this.elements.nextBtn.classList.remove(
            "opacity-70",
            "cursor-not-allowed",
          );
          this.elements.btnText.textContent = "Try Again";
        },

        showCat(imageUrl) {
          this.elements.loader.classList.add("hidden");
          this.elements.error.classList.add("hidden");

          // Set the image source
          this.elements.catImage.src = imageUrl;

          // Wait for the image to actually load before revealing it
          this.elements.catImage.onload = () => {
            this.elements.imageContainer.classList.remove("hidden");

            // Re-enable button
            this.elements.nextBtn.disabled = false;
            this.elements.nextBtn.classList.remove(
              "opacity-70",
              "cursor-not-allowed",
            );
            this.elements.btnText.textContent = "Show Me Another Cat";
          };

          // Handle broken images
          this.elements.catImage.onerror = () => {
            this.showError();
          };
        },

        // Bind the button click to whatever fetch function you provide
        onNextClick(callback) {
          this.elements.nextBtn.addEventListener("click", callback);
        },
      };
    </script>

    <script src="script.js"></script>
  </body>
</html>
